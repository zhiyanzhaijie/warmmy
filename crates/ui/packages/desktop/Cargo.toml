[package]
name = "warmmy"
version = "0.1.0"
edition = "2021"

[package.metadata.bundle]
name = "Warmmy屋米"
identifier = "com.zhiyanzhaijie.warmmy.desktop"
icon = ["../ui/assets/app-icon.ico", "../ui/assets/app-icon.png", "../ui/assets/app-icon.icns"]

[dependencies]
dioxus = { workspace = true, features = ["router"] }
dioxus-icons = { version = "0.1.0", default-features = false }
ui = { workspace = true }
api = { workspace = true }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }

[features]
default = []
desktop = ["dioxus/desktop", "ui/desktop", "ui/local", "api/local"]
