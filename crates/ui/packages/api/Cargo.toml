[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true }
dioxus-fullstack = { version = "0.7.9", default-features = false }
dioxus-fullstack-core = "0.7.9"
infra = { path = "../../../infra", optional = true }
app = { path = "../../../app" }
domain = { path = "../../../domain" }
futures-util = "0.3"
async-stream = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["sync"], optional = true }

[features]
server = ["dioxus/fullstack", "dioxus/server", "dioxus-fullstack/server", "dep:infra"]
local = ["dep:infra", "dep:tokio"]
web = []
